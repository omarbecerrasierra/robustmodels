[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "robustmodels"
version = "0.1.1"
description = "Robust statistics for Python: univariate location and scale, multivariate location and scatter."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "omarbecerrasierra" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.6",
]
keywords = ["robust statistics", "MCD", "Qn", "Sn", "medcouple", "outliers", "covariance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://github.com/omarbecerrasierra/robustmodels"
Documentation = "https://omarbecerrasierra.github.io/robustmodels/"
Repository = "https://github.com/omarbecerrasierra/robustmodels"
Issues = "https://github.com/omarbecerrasierra/robustmodels/issues"
Changelog = "https://github.com/omarbecerrasierra/robustmodels/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]
docs = ["sphinx>=8", "furo>=2024.8.6", "myst-parser>=4"]

[tool.hatch.build.targets.sdist]
include = ["/src/robustmodels", "/tests", "/docs", "/README.md", "/CONTRIBUTING.md", "/LICENSE", "/CHANGELOG.md", "/CITATION.cff"]

[tool.pytest.ini_options]
testpaths = ["tests", "docs"]
addopts = "-ra --doctest-glob='*.md'"

[tool.coverage.run]
branch = true
source = ["robustmodels"]

[tool.coverage.report]
show_missing = true
fail_under = 100

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
