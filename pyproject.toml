[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "robustmodels"
version = "0.1.3"
description = "Robust statistics for Python: covariance, PCA, regression, GLMs, depth and diagnostics."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Omar Becerra Sierra" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.6",
    "matplotlib>=3.7",
]
keywords = [
    "robust statistics",
    "robust covariance",
    "minimum covariance determinant",
    "MCD",
    "MRCD",
    "MVE",
    "OGK",
    "S-estimator",
    "MM-estimator",
    "Mahalanobis distance",
    "robust PCA",
    "ROBPCA",
    "discriminant analysis",
    "robust generalized linear models",
    "halfspace depth",
    "bagplot",
    "outlier detection",
    "Hodges-Lehmann",
    "Qn",
    "Sn",
    "medcouple",
    "robustbase",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://github.com/omarbecerrasierra/robustmodels"
Documentation = "https://omarbecerrasierra.github.io/robustmodels/"
Repository = "https://github.com/omarbecerrasierra/robustmodels"
Issues = "https://github.com/omarbecerrasierra/robustmodels/issues"
Changelog = "https://github.com/omarbecerrasierra/robustmodels/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]
docs = [
    "sphinx>=8",
    "furo>=2024.8.6",
    "myst-parser>=4",
    "sphinx-sitemap>=2.6",
    "sphinxext-opengraph>=0.10",
]

[tool.hatch.build.targets.sdist]
include = ["/src/robustmodels", "/tests", "/docs", "/README.md", "/CONTRIBUTING.md", "/LICENSE", "/CHANGELOG.md", "/CITATION.cff", "/ROADMAP.md"]

[tool.pytest.ini_options]
testpaths = ["tests", "docs"]
addopts = "-ra --doctest-glob='*.md'"

[tool.coverage.run]
branch = true
source = ["robustmodels"]

[tool.coverage.report]
show_missing = true
fail_under = 100

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
